name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Lint, deterministic engine tests, bot loop-promise assertions, build
      - run: npm run test:quality
      # Chromium checks the new loop: build, defend, win, collect and choose a kit.
      # Fails on console errors or layout overflow.
      - run: npm run test:smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Capture viewport screenshots
        if: always()
        run: node scripts/screenshot.mjs browser-screenshots
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: browser-screenshots
      - name: Capture browser frame pacing
        run: node scripts/perf-probe.mjs --seconds 4 --repeat 3 > browser-performance.json
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Capture explicit strategy examples
        run: npm run --silent test:strategies > build-strategies.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-strategies
          path: build-strategies.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-performance
          path: browser-performance.json
